name: PRAXIS Strategy Lab Market Collector
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/strategy_lab/collector.py'
      - '.github/workflows/praxis-strategy-lab.yml'
permissions:
  contents: write
concurrency:
  group: praxis-strategy-lab
  cancel-in-progress: false
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate UTC 1m candles (no trading)
        run: python tools/strategy_lab/collector.py
      - name: Commit ledger only if it changed
        shell: bash
        run: |
          git config user.name 'praxis-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/strategy_lab/data/
          if git diff --cached --quiet; then echo 'No new ledger'; exit 0; fi
          git commit -m 'data: hourly PRAXIS Strategy Lab snapshot'
          git push